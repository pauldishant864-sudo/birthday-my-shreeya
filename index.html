<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Birthday Surprise</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe9ef;--bg2:#ffd3e0;--ink:#5a1f3a;--soft:#9b5573;--pink:#ff6f9c;--card:#fffafc;--line:#ffb8cf;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1020;--bg2:#3b1830;--ink:#ffe3ee;--soft:#e0a3bd;--pink:#ff7aa6;--card:#38192c;--line:#7a3a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1020;--bg2:#3b1830;--ink:#ffe3ee;--soft:#e0a3bd;--pink:#ff7aa6;--card:#38192c;--line:#7a3a5c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 0%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow-x:hidden}
#app{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:28px 22px;text-align:center;position:relative;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2{font-family:Caveat,cursive;font-weight:700;margin:.2em 0 .3em;line-height:1.05}
h1{font-size:2.8rem}h2{font-size:2.2rem}
p{line-height:1.55;margin:.5em 0}
.tag{color:var(--soft);font-size:.95rem}
.big{font-size:3.2rem;line-height:1.1;margin:.2em 0}
button,input,textarea{font:inherit}
.btn{background:var(--pink);color:#fff;border:0;border-radius:999px;padding:13px 28px;font-weight:700;font-size:1.05rem;cursor:pointer;margin:8px 4px;min-height:48px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.back{position:absolute;top:14px;left:16px;background:none;border:0;color:var(--soft);cursor:pointer;font-size:.95rem;padding:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
input,textarea{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);color:var(--ink);margin:6px 0}
textarea{min-height:130px;resize:vertical}
label{display:block;text-align:left;font-weight:700;font-size:.9rem;margin-top:10px}
.field{margin-bottom:6px}
/* balloons */
.sky{position:relative;height:300px;margin:10px 0}
.balloon{position:absolute;width:84px;height:104px;border:0;border-radius:50% 50% 48% 48%;color:#fff;font-weight:700;font-size:.85rem;cursor:pointer;animation:bob 3s ease-in-out infinite;transition:transform .25s,opacity .25s}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:60px;background:var(--line)}
.balloon.pop{transform:scale(1.6);opacity:0;pointer-events:none}
@keyframes bob{50%{translate:0 -12px}}
/* cake */
.cake{width:200px;margin:10px auto;position:relative}
.flame{font-size:2rem;position:absolute;left:50%;top:-4px;translate:-50% 0;cursor:pointer;background:none;border:0;animation:flick .6s infinite alternate}
@keyframes flick{to{transform:scale(1.15) rotate(5deg)}}
/* roses */
.roses{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.rose{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:10px 4px;cursor:pointer;color:var(--ink)}
.rose span{font-size:2rem;display:block}
.rose small{display:block;font-size:.78rem;margin-top:4px;min-height:2.6em}
.pic{width:100%;max-height:60vh;object-fit:cover;border-radius:20px;border:6px solid #fff;box-shadow:0 6px 18px rgba(90,31,58,.25);transform:rotate(-2deg);margin:12px 0;cursor:pointer}
.ph{border:2px dashed var(--line);border-radius:20px;padding:36px 12px;margin:12px 0;color:var(--soft)}
/* lock */
.dots{display:flex;gap:12px;justify-content:center;margin:16px 0 20px}.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--pink);display:block}.dot.on{background:var(--pink)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}.key{height:64px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.5rem;font-weight:700;cursor:pointer}.key:active{background:var(--line)}
.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
/* envelope */
.env{font-size:5rem;cursor:pointer;background:none;border:0;animation:bob 2.5s infinite}
.letter{text-align:left;background:var(--bg);border:2px dashed var(--line);border-radius:18px;padding:16px;margin-top:10px;white-space:pre-wrap;line-height:1.6;max-height:50vh;overflow:auto}
.fall{position:fixed;top:-30px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.reel{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:3/4;display:flex;margin:12px 0}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.mv{animation:kb 3.6s ease forwards}
@keyframes kb{0%{opacity:0;transform:scale(1)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.cap{position:absolute;bottom:0;left:0;right:0;padding:40px 12px 14px;color:#fff;font-family:Caveat,cursive;font-size:1.8rem;line-height:1.1;background:linear-gradient(transparent,rgba(0,0,0,.65));z-index:1}
.reel .btn{position:relative;z-index:2;margin:auto}
#mu{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:1.3rem;cursor:pointer;z-index:10}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.mv{opacity:1!important}}
</style>
</head>

<div id="app"></div>

function note(f,v){const t=AC.currentTime;[[f,'sine',v],[f*2,'triangle',v*.25]].forEach(([fr,ty,g])=>{const o=AC.createOscillator(),a=AC.createGain();o.type=ty;o.frequency.value=fr;a.gain.setValueAtTime(muted?0:g,t);a.gain.exponentialRampToValueAtTime(.0008,t+1.4);o.connect(a);a.connect(AC.destination);o.start(t);o.stop(t+1.5)})}
function music(){if(mt)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){return}
const ch=[[261.6,329.6,392,523.3],[196,246.9,293.7,392],[220,261.6,329.6,440],[174.6,220,261.6,349.2]],pat=[0,1,2,3,2,1,2,3];let k=0;

function go(n){clearTimeout(mv);step=n;render()}

const bindNext=()=>{const n=$('#nx');if(n)n.onclick=()=>go(step+1)};

()=>{popped=0;const L=['For You','My Love','Best Girl','Happy Birthday'],C=['#ff6f9c','#ff9a6f','#b56fff','#4fc3b0'],P=[[6,20],[104,0],[196,34],[132,150]];

()=>{card(`<div class="big">🐰 🧸</div><h1>Lots of love for you, ${esc(D.name)} ❤️</h1><p>Wishing you the happiest birthday, filled with love, laughter and all the beautiful things in life! 🎂✨</p><button class="btn" id="rp">Replay \u21bb</button>`);hearts(40);$('#rp').onclick=()=>go(1)}
];
const dots=()=>[0,1,2,3,4,5].map(i=>`<i class="dot${i<code.length?' on':''}"></i>`).join('');
function lock(){app.innerHTML=`<div class="card" id="lk"><div class="big">🔒</div><h1>A surprise is waiting</h1><p class="tag" id="lm">Enter the 6-digit passcode</p><div class="dots" id="ds">${dots()}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="key" data-k="${k}" aria-label="${k==='⌫'?'Delete':k}">${k}</button>`).join('')}</div></div>`;document.querySelectorAll('.key').forEach(b=>b.onclick=()=>press(b.dataset.k))}
function press(k){if(!locked)return;if(k==='⌫')code=code.slice(0,-1);else if(code.length<6)code+=k;$('#ds').innerHTML=dots();
if(code.length===6){if(code===CODE){locked=false;hearts(20);render()}else setTimeout(()=>{code='';lock();$('#lm').textContent='Not quite, try again 💗';$('#lk').classList.add('shake')},250)}}

D.name='Shreeya';D.from='Yours ❤️';step=1;

render();
